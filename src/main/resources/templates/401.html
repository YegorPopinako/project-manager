<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>401 - Unauthorized</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e0f7fa);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #00796b;
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1.1em;
        }
        .login-button {
            display: inline-flex;
            align-items: center;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: #444;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .login-button:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .google-icon {
            height: 24px;
            margin-right: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Oops! You're not logged in</h1>
    <p>To access this page, please sign in with your Google account.</p>
    <a class="login-button" href="/oauth2/authorization/google">
        <img class="google-icon" src="https://png.pngtree.com/png-vector/20230817/ourmid/pngtree-google-internet-icon-vector-png-image_9183287.png" alt="Google Logo">
        Sign in with Google
    </a>
</div>
</body>
</html>
