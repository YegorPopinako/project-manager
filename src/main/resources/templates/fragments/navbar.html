<div th:fragment="navbar(notifications)">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 30px; background-color: #f8f9fa; border-bottom: 1px solid #dee2e6;">
        <div style="font-size: 24px; font-weight: bold; cursor: pointer;" onclick="location.href='/home'">
            Project Manager
        </div>

        <!-- Right-side container for bell and profile -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Notification Bell -->
            <div class="notif-container" style="position: relative;">
                <button id="notifBell"
                        style="background-color: transparent; border: none; font-size: 18px; cursor: pointer;">
                    🔔
                </button>
                <div id="notifDropdown" style="display: none;position: absolute; top: 35px;right: 0; background: white; border: 1px solid #ccc;
    padding: 10px;
    min-width: 280px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 999;
    border-radius: 8px;
">
                    <ul th:if="${notifications != null and !notifications.isEmpty()}"
                        style="list-style: none; padding: 0; margin: 0;">

                        <li th:each="notif : ${notifications}" style="
            padding: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            transition: background-color 0.2s;
        "
                            onmouseover="this.style.backgroundColor='#e9ecef'"
                            onmouseout="this.style.backgroundColor='#f8f9fa'">
                            <a th:href="@{'/api/project/' + ${notif.projectId}}"
                               th:text="${notif.message}"
                               style="text-decoration: none; color: #333; font-weight: 500;"></a>
                        </li>
                    </ul>

                    <span th:if="${notifications == null or notifications.isEmpty()}"
                          style="color: #888; font-style: italic;">
        No notifications
    </span>
                </div>

            </div>

            <!-- Profile Icon -->
            <button style="background-color: transparent; border: none; font-size: 18px; cursor: pointer;"
                    onclick="location.href='/api/user'">
                👤
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bell = document.getElementById("notifBell");
            const dropdown = document.getElementById("notifDropdown");

            bell.addEventListener("click", (e) => {
                e.stopPropagation();
                dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
            });

            window.addEventListener("click", (e) => {
                if (!e.target.closest(".notif-container")) {
                    dropdown.style.display = "none";
                }
            });
        });
    </script>
</div>
